{% load static %}
<div class="requestForm js-requestForm">
  <div class="requestForm__overlay js-toggle-requestForm"></div>

  <div class="requestForm__content">
    <div class="requestForm__container">
      <div class="requestForm__close js-toggle-requestForm">
        <button type="button">
          <i class="icon-cross"></i>
        </button>
      </div>

      <h3 class="requestForm__title"><span class="text-accent-1">Get in</span><br> touch</h3>

      {% if property.pk %}
        <p class="mt-15">About: <strong>{{ property.name }}</strong> — {{ property.project.name }}</p>
      {% elif project.pk %}
        <p class="mt-15">About: <strong>{{ project.name }}</strong></p>
      {% endif %}

      <form method="post" action="{% url 'developments:contact' %}" class="requestForm__form contactForm row y-gap-30 js-lead-form">
        {% csrf_token %}
        {% if property.pk %}
          <input type="hidden" name="property" value="{{ property.pk }}">
        {% elif project.pk %}
          <input type="hidden" name="project" value="{{ project.pk }}">
        {% endif %}

        <div class="col-12">
          <div class="contactForm__field">
            <div class="lh-12 fw-500 uppercase">Full name</div>
            <input type="text" name="name" maxlength="150" required>
          </div>
        </div>
        <div class="col-12">
          <div class="contactForm__field">
            <div class="lh-12 fw-500 uppercase">phone</div>
            <input type="tel" name="phone" maxlength="50">
          </div>
        </div>
        <div class="col-12">
          <div class="contactForm__field">
            <div class="lh-12 fw-500 uppercase">E-MAIL</div>
            <input type="email" name="email" required>
          </div>
        </div>

        <div class="col-12">
          <div class="contactForm__field">
            <div class="lh-12 fw-500 uppercase">YOUR MESSAGE</div>
            <textarea name="message" rows="3"></textarea>
          </div>
        </div>
        <div class="col-12">
          <button type="submit" class="button -md -dark-1 bg-accent-1 text-white col-12">submit</button>
        </div>
      </form>
    </div>
  </div>
</div>
